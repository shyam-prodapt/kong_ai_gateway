services:
  kong:
    image: kong:3.9
    container_name: kong-ai-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: "info"
      # Kong's built-in env vault resolves {vault://env/groq-api-key} -> $GROQ_API_KEY
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"   # proxy (the AI gateway endpoint)
      - "8001:8001"   # admin API (optional, for debugging)
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
