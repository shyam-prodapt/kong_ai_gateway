_format_version: "3.0"

# DB-less declarative config for a self-hosted Kong AI Gateway.
# - ai-proxy:        routes OpenAI-format chat requests to Groq (key injected by Kong)
# - ai-prompt-guard: blocks prompt-injection inputs with PCRE deny patterns (HTTP 400)
#
# The Groq API key is read from the GROQ_API_KEY environment variable via Kong's
# built-in env vault reference {vault://env/groq-api-key}. Never hard-code it here.

services:
  - name: ai-llm
    # Placeholder upstream; ai-proxy overrides the real upstream (Groq) below.
    url: http://localhost:8000
    routes:
      - name: ai-chat
        # OpenAI SDK clients post to <base>/chat/completions, so a /v1 prefix route
        # matches when the app sets base_url = https://<host>/v1
        paths:
          - /v1
        strip_path: false
        plugins:
          - name: ai-proxy
            config:
              route_type: "llm/v1/chat"
              model:
                provider: "openai"
                name: "llama-3.3-70b-versatile"
                options:
                  # Full Groq chat-completions endpoint (ai-proxy uses this verbatim).
                  upstream_url: "https://api.groq.com/openai/v1/chat/completions"
              auth:
                header_name: "Authorization"
                header_value: "Bearer {vault://env/groq-api-key}"

          - name: ai-prompt-guard
            config:
              # Block injection / jailbreak phrasing on user messages. Everything
              # else passes, so normal grid queries flow through untouched.
              deny_patterns:
                - '(?i)ignore\s+(all|any|the|previous|prior|above)\s+(previous|prior|above|instructions|prompts?|context)'
                - '(?i)disregard\s+(the\s+)?(above|previous|prior|system|earlier)'
                - '(?i)forget\s+(all|everything|previous|your)'
                - '(?i)\bsystem\s+prompt\b'
                - '(?i)reveal\s+(your|the)\s+(system\s+prompt|instructions|prompt|rules)'
                - '(?i)override\s+(your|the|all|any)\s+(instructions|rules|guard|safety)'
                - '(?i)\bjailbreak\b'
                - '(?i)\bdeveloper\s+mode\b'
                - '(?i)\bdo\s+anything\s+now\b'
