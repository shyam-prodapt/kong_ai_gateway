_format_version: "3.0"

# DB-less declarative config for a self-hosted Kong AI Gateway.
#
# Routes:
#   /v1    -> ai-proxy: OpenAI-format chat -> Groq (caller supplies the Bearer key)
#   /guard -> guard-only probe: returns 200 if allowed, 400 if blocked (NO LLM call)
#
# ai-prompt-guard is attached at the SERVICE level, so it guards BOTH routes:
#   - on /v1 it guards the real LLM prompt
#   - on /guard it lets the app cheaply pre-check a query (request-termination
#     returns 200 when the guard allows it; the guard returns 400 when it denies)

services:
  - name: ai-llm
    url: http://localhost:8000   # placeholder; ai-proxy overrides the real upstream
    plugins:
      - name: ai-prompt-guard
        config:
          # Block injection / jailbreak phrasing on user messages. Normal grid
          # queries don't match, so legitimate traffic flows through untouched.
          deny_patterns:
            - '(?i)ignore\s+(all|any|the|previous|prior|above)\s+(previous|prior|above|instructions|prompts?|context)'
            - '(?i)disregard\s+(the\s+)?(above|previous|prior|system|earlier)'
            - '(?i)forget\s+(all|everything|previous|your)'
            - '(?i)\bsystem\s+prompt\b'
            - '(?i)reveal\s+(your|the)\s+(system\s+prompt|instructions|prompt|rules)'
            - '(?i)override\s+(your|the|all|any)\s+(instructions|rules|guard|safety)'
            - '(?i)\bjailbreak\b'
            - '(?i)\bdeveloper\s+mode\b'
            - '(?i)\bdo\s+anything\s+now\b'
    routes:
      - name: ai-chat
        paths:
          - /v1
        strip_path: false
        plugins:
          - name: ai-proxy
            config:
              route_type: "llm/v1/chat"
              # No auth block: the client's Authorization: Bearer <groq-key> is
              # forwarded to the upstream (Groq).
              model:
                provider: "openai"
                name: "llama-3.3-70b-versatile"
                options:
                  upstream_url: "https://api.groq.com/openai/v1/chat/completions"

      - name: ai-guard
        paths:
          - /guard
        strip_path: false
        plugins:
          # Runs only if ai-prompt-guard (higher priority) allowed the request.
          - name: request-termination
            config:
              status_code: 200
              content_type: "application/json"
              body: '{"status":"allowed"}'
